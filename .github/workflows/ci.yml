name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  spm:
    name: SPM build & test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint (only if config present)
        run: |
          if [ -f .swiftlint.yml ]; then
            if ! command -v swiftlint >/dev/null 2>&1; then
              brew install swiftlint
            fi
            swiftlint --strict
          else
            echo "No .swiftlint.yml present; skipping."
          fi
